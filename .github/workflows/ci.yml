# CI — independent-witness substrate for the Worldline repo.
#
# WHY THIS EXISTS
#   The symbiote / trust-machine Stage-0 probe flagged that this repo had no
#   external corroborator: every existing gate runs locally, under the same
#   custodian group, on the same machine — easy to fake a green by skipping.
#   This workflow is that missing cross-substrate witness: it runs on GitHub's
#   own runners, on every push and PR, and re-runs the REAL existing gates.
#   It does not invent new checks — every step below maps to a script or test
#   that already lives in the repo.
#
# HARD CONSTRAINTS (Peat directive, do not "improve" away)
#   - NO commit-signing / GPG / SSH-signing step. Signing with Peat's key would
#     gate the agents' own verify-and-close loop on Peat's key and break team
#     autonomy. The independent witness is CI itself, not a signature.
#   - NO steps requiring secrets. Everything here runs with the default
#     read-only GITHUB_TOKEN and needs no repo/org secrets.

name: ci

on:
  push:
  pull_request:

# Least privilege: the witness only needs to read the checked-out tree.
permissions:
  contents: read

# Never run signing/secret-bearing logic; make the absence explicit & auditable.
# (No `secrets:` are referenced anywhere in this file.)

jobs:
  verify:
    name: typecheck · lint · gates · deterministic sensors · build · CI census
    runs-on: ubuntu-latest
    env:
      # Public, non-privileged build inputs. Configure these as GitHub Actions
      # repository variables; never substitute the Supabase service-role key.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        # fetch-depth: 0 = full history. The append-only witness
        # (audit-ledger-append-only.sh) walks every committed revision of the
        # integrity ledger to prove no prior-committed line was mutated/removed;
        # the default shallow clone (depth 1) would expose only one revision and
        # silently neuter the cross-revision check. Read-only; no token scope
        # change — full history needs no secrets.
        with:
          fetch-depth: 0

      # Match the local toolchain: Node 24 (repo dev runs v24.x), npm + lockfile.
      # No .nvmrc / packageManager field exists, so node-version is pinned here.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # npm ci uses package-lock.json (the committed lockfile) for a clean,
      # reproducible install — the same dependency closure the team builds against.
      - name: Install dependencies
        id: install
        run: npm ci

      # Keep the root tooling directory out of Vercel deployments without
      # excluding the application module at lib/netra/tools.
      - name: Verify Vercel source boundary
        run: |
          test -f lib/netra/tools/index.ts
          grep -Fxq '/tools/' .vercelignore
          if grep -Fxq 'tools/' .vercelignore; then
            echo 'unanchored tools/ rule would remove lib/netra/tools' >&2
            exit 1
          fi

      # ── Typecheck ──────────────────────────────────────────────────────────
      # tsconfig.json already sets noEmit:true + strict:true. There is no
      # `typecheck` npm script in package.json, so invoke the TypeScript compiler
      # directly via the locally-installed binary (npx --no-install resolves the
      # devDependency `typescript`, never fetches a new one).
      - name: Typecheck (tsc --noEmit)
        run: npx --no-install tsc --noEmit

      # ── Lint ───────────────────────────────────────────────────────────────
      # Real script: package.json "lint": "eslint"
      - name: Lint (eslint)
        run: npm run lint

      # Real script: package.json "harness:barrier-class"
      #   → scripts/audit-rail-barrier-class.sh
      - name: Gate — rail barrier-class audit
        run: npm run harness:barrier-class

      # ── Deterministic test-sensor census ──────────────────────────────────
      # Algol classifies every tracked executable under tests/. Canopus uses
      # the Git index as the denominator, so a newly tracked Node/shell/Python
      # sensor cannot disappear merely because a workflow list was not edited.
      # Candidate is evidence-backed only: portable passes must be required;
      # every remaining candidate needs a verified command/exit/blocker record.
      - name: Validate tracked deterministic sensor census
        run: bash scripts/audit-ci-test-census.sh --validate

      # Every tracked *.test.mjs is discovered directly and must also be in the
      # required manifest set. Either omission or downgrade fails before run.
      - name: Deterministic Node sensors (tracked discovery)
        run: bash scripts/audit-ci-test-census.sh --node

      # Required portable shell/Python/nonstandard sensors are manifest-driven
      # because tests/harness also contains mutation, context, and manual probes
      # that are unsafe or meaningless on every push.
      - name: Deterministic shell and Python sensors (required manifest lane)
        run: bash scripts/audit-ci-test-census.sh --shell-python

      # ── Forge-resistant integrity-ledger witness (the trust-root) ──────────
      # This is THE reason CI is a forge-resistant anchor and a LOCAL gate is
      # not. The integrity-ledger writing agent runs AS Peat (fs read+write), so
      # any local anchor is forgeable: a held key is agent-readable, an OS-perm
      # lock is agent-as-owner, an in-file hash chain is agent-recomputable. The
      # ONLY check it cannot forge past is "this ledger entry was a different
      # value in PRIOR COMMITTED history" — asserted here, on GitHub's runners
      # (a substrate the agent cannot fake), over append-only git history the
      # agent cannot rewrite without a force-push, which branch protection on the
      # witness ref forbids (a toggle ONLY Peat sets at the seam).
      #
      # This is NOT a hash-recompute: a co-tamper rewrites both the body AND its
      # stored sha256, so every recompute passes. The script compares COMMITTED
      # REVISIONS of the ledger against each other (append-only), catching the
      # M1-B co-tamper (incl. the terminal entry the in-file chain cannot) and
      # the M2-C5 deletion-co-tamper — both share this single root.
      #
      # NEUTRAL (exit 0) before the ledger is seeded: with zero or one committed
      # ledger revision there is nothing prior to have been mutated, so CI is
      # never red pre-operationally. Honors the HARD CONSTRAINTS above: no
      # signing, no secrets, read-only checkout. Full git history (the checkout
      # step sets fetch-depth: 0) is required for the cross-revision walk.
      #
      # WHERE THE GUARANTEE LIVES: forge-resistance attaches ONLY to the run over
      # the fast-forward-only, branch-protected witness ref (refs/heads/
      # integrity-witness — see .harness/WITNESS-REF-DESIGN.md). The audit walks
      # --first-parent so it is also correct (no false-positive) if it ever runs
      # on a merge HEAD (e.g. a PR merge ref), but the LOAD-BEARING run — the one
      # Peat should mark as a required status check at the seam — is the one on
      # the witness ref. WL_WITNESS_REF is passed explicitly so the contract does
      # not silently trust ambient HEAD.
      - name: Witness (authoritative) — append-only over the protected witness ref
        if: github.ref == 'refs/heads/integrity-witness'
        env:
          WL_WITNESS_REF: HEAD
        run: bash scripts/audit-ledger-append-only.sh

      # Informational run on all other push/PR events: same check, same
      # --first-parent determinism, but NOT the forge-resistant run (these refs
      # are rebaseable, so a green here is a convenience signal, not the anchor).
      #
      # continue-on-error: true is LOAD-BEARING — this step must NEVER block.
      # On a pull_request event, checkout gives refs/pull/N/merge, whose FIRST
      # PARENT is the base branch. Once the ledger is live and base advances with
      # its own appends after the PR branched, a perfectly legitimate append-only
      # union (e.g. [h,a,pr1,main1]) is not a prefix of the base spine tip
      # ([h,a,main1]) — git's JSONL conflict-resolution order is not guaranteed.
      # Without continue-on-error that exit 1 would RED a legit PR (verified in
      # sandbox). These refs are explicitly NOT append-only by construction
      # (WITNESS-REF-DESIGN.md §1), so blocking on them would contradict the
      # thesis. This stays a visible signal only; the anchor is the authoritative
      # run on the protected witness ref above.
      - name: Witness (informational) — append-only on this ref
        if: github.ref != 'refs/heads/integrity-witness'
        continue-on-error: true
        run: bash scripts/audit-ledger-append-only.sh

      # ── Build (appropriate IN CI — runner-local, not the local .next) ──────
      # Real script: package.json "build": "next build && npm run index:search"
      # This is CI's own ephemeral runner; it is NOT the local .next another
      # workflow owns. Building here proves the gates ran against a buildable tree.
      - name: Validate public build inputs
        id: build_env
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [[ -z "${NEXT_PUBLIC_SUPABASE_URL}" || -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo 'NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be configured as repository variables' >&2
            exit 1
          fi

      - name: Build (Next + search index)
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.build_env.outcome == 'success' }}
        run: npm run build

      # The runner reads every rail from .harness/worldline-harness.config.json.
      # `--ci` is an explicit safe mode: task-context, browser, and deferred
      # rails are records, not accidental executions. The census still runs
      # after an earlier check/build failure when installation succeeded;
      # search-index then reports missing build output as ERROR. Cancellation
      # stops it, avoiding `always()` work after the job is intentionally halted.
      - name: Harness CI census (config-driven)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash .claude/hooks/harness-check.sh --ci

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Factory — TASK Tracking</title>
<!-- Google Fonts: best-effort (non-blocking fallback to system fonts when offline) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- Vendored locally — no CDN dependency at runtime -->
<script src="./vendor/react.development.js"></script>
<script src="./vendor/react-dom.development.js"></script>
<script src="./vendor/babel.min.js"></script>
<script src="factory-data.js"></script>
<style>
  :root {
    --bg: #15130f;
    --panel: #1d1a14;
    --panel-2: #232017;
    --line: #2f2a1f;
    --text: #e8e2d4;
    --muted: #8a8576;
    --faint: #5a564a;
    --accent: #d97757;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Archivo', sans-serif;
    --pad: 16px;
    --card-pad: 14px;
    --fs: 13px;
  }
  [data-density="compact"] { --pad: 10px; --card-pad: 9px; --fs: 12px; }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: var(--fs); }
  body {
    background-image:
      radial-gradient(ellipse 1200px 500px at 70% -10%, rgba(217,119,87,0.06), transparent),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.006) 3px 4px);
    min-height: 100vh;
  }
  #root { max-width: 1380px; margin: 0 auto; padding: 0 24px 60px; }

  /* ── Header ── */
  .hdr { display: flex; align-items: center; gap: 20px; padding: 20px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
  .hdr-brand { display: flex; align-items: center; gap: 12px; }
  .hdr-mark { width: 34px; height: 34px; border: 1.5px solid var(--accent); display: grid; place-items: center; color: var(--accent); font-family: var(--display); font-weight: 800; font-size: 15px; }
  .hdr-title { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.02em; }
  .hdr-sub { color: var(--muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 2px; }
  .hdr-nav { display: flex; gap: 4px; margin-left: auto; }
  .nav-btn { font-family: var(--mono); font-size: var(--fs); background: none; border: 1px solid transparent; color: var(--muted); padding: 7px 16px; cursor: pointer; letter-spacing: 0.04em; }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.on { color: var(--accent); border-color: var(--line); background: var(--panel); }
  .hdr-live { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; border: 1px solid var(--line); padding: 6px 12px; }
  .hdr-meta { color: var(--faint); font-size: 10.5px; border: 1px solid var(--line); padding: 6px 10px; }

  /* ── Loading / error states ── */
  .state-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 40vh; gap: 12px; color: var(--muted); font-size: 13px; }
  .state-screen .state-icon { font-size: 28px; color: var(--faint); }
  .state-screen .state-title { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--text); }
  .state-screen .state-detail { color: var(--faint); font-size: 11px; max-width: 420px; text-align: center; line-height: 1.6; }
  .retry-btn { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 8px 18px; cursor: pointer; margin-top: 4px; }
  .retry-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ── Shared bits ── */
  .view { display: flex; flex-direction: column; gap: var(--pad); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .status-dot.pulsing { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .status-dot.pulsing { animation: none; } }
  .prio-tag { font-size: 10px; font-weight: 600; border: 1px solid; padding: 1px 5px; letter-spacing: 0.06em; }
  .model-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; letter-spacing: 0.03em; }
  .model-dot { width: 6px; height: 6px; flex: none; }
  .feat-key { color: var(--muted); font-size: 11px; letter-spacing: 0.05em; margin-right: 6px; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--pad); }
  .stat-card { background: var(--panel); border: 1px solid var(--line); padding: var(--card-pad); }
  .stat-label { color: var(--muted); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; }
  .stat-value { font-family: var(--display); font-weight: 800; font-size: 30px; margin-top: 6px; letter-spacing: 0.01em; }
  [data-density="compact"] .stat-value { font-size: 24px; }
  .stat-sub { color: var(--faint); font-size: 11px; margin-top: 4px; }

  .panel { background: var(--panel); border: 1px solid var(--line); padding: var(--card-pad); }
  .panel-row { display: flex; gap: var(--pad); align-items: stretch; }
  .panel-row .panel { flex: 1; min-width: 0; }
  .panel-row .grow-2 { flex: 2; }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; gap: 10px; flex-wrap: wrap; }
  .panel-head h3 { font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); }
  .panel-hint { color: var(--faint); font-size: 10.5px; }
  .legend { display: flex; gap: 12px; }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10.5px; }
  .legend-item i { width: 8px; height: 8px; display: inline-block; }

  /* charts */
  .daily-bars { display: flex; align-items: flex-end; gap: 6px; padding-top: 6px; }
  .day-col { flex: 1; display: flex; flex-direction: column; align-items: stretch; gap: 5px; min-width: 0; }
  .day-stack { display: flex; flex-direction: column-reverse; justify-content: flex-start; }
  .day-seg { width: 100%; }
  .day-label { color: var(--faint); font-size: 9.5px; text-align: center; }
  .breakdown { display: flex; flex-direction: column; gap: 7px; }
  .bk-row { display: grid; grid-template-columns: 92px 1fr 58px; gap: 8px; align-items: center; }
  .bk-name { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-track { height: 10px; background: var(--panel-2); }
  .bk-fill { height: 100%; }
  .bk-val { text-align: right; font-size: 11px; color: var(--text); }

  /* table */
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th { text-align: left; color: var(--faint); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; padding: 4px 10px 8px; border-bottom: 1px solid var(--line); }
  .data-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: var(--fs); }
  [data-density="compact"] .data-table td { padding: 5px 8px; }
  .data-table tbody tr { cursor: pointer; }
  .data-table tbody tr:hover { background: var(--panel-2); }
  .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .cost-cell { color: var(--accent); }

  /* stepper */
  .stepper { display: inline-flex; gap: 3px; }
  .step { --step-c: var(--faint); display: flex; align-items: center; padding: 2px 7px; border: 1px solid var(--line); color: var(--faint); font-size: 9px; letter-spacing: 0.08em; }
  .step-done { color: var(--step-c); border-color: color-mix(in oklab, var(--step-c) 45%, transparent); }
  .step-active { color: #fff; background: color-mix(in oklab, var(--step-c) 50%, var(--panel)); border-color: var(--step-c); }
  .stepper-lg .step { padding: 6px 18px; font-size: 11px; }

  /* board */
  .board { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--pad); align-items: start; }
  .board-col { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--dom-c, var(--line)); min-height: 200px; }
  .board-col-shipped { --dom-c: #4a463a; border-top-style: dashed; }
  .board-col-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .board-col-name { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dom-c, var(--muted)); }
  .board-col-shipped .board-col-name { color: var(--muted); }
  .board-col-count { color: var(--faint); font-size: 11px; }
  .board-cards { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .board-empty { color: var(--faint); text-align: center; padding: 18px 0; }
  .feat-card { background: var(--panel-2); border: 1px solid var(--line); padding: var(--card-pad); cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s; }
  .feat-card:hover { border-color: var(--dom-c, var(--accent)); }
  .feat-card-top { display: flex; justify-content: space-between; align-items: center; }
  .feat-card-title { font-size: 12px; line-height: 1.45; color: var(--text); text-wrap: pretty; }
  .feat-card-meta { display: flex; gap: 10px; color: var(--faint); font-size: 10.5px; }
  .feat-card-live { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--accent); border-top: 1px dashed var(--line); padding-top: 7px; }
  .feat-card-shipped { opacity: 0.65; }
  .ship-check { color: #7fae6a; }

  /* detail */
  .detail-head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .back-btn { font-family: var(--mono); font-size: var(--fs); background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 7px 14px; cursor: pointer; }
  .back-btn:hover { color: var(--text); border-color: var(--muted); }
  .detail-title-wrap { flex: 1; min-width: 240px; }
  .detail-eyebrow { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .detail-status { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; }
  .detail-title { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: 0.01em; text-wrap: pretty; }
  .detail-stats { display: flex; gap: 22px; padding-top: 6px; }
  .detail-stats > div { display: flex; flex-direction: column; }
  .ds-val { font-family: var(--display); font-weight: 800; font-size: 20px; }
  .ds-label { color: var(--faint); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

  /* spawn tree */
  .spawn-tree { display: flex; flex-direction: column; gap: 0; }
  .tree-root { padding-left: 0; max-width: 560px; }
  .root-node { border-left: 2px solid var(--accent); }
  .tree-branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: var(--pad); margin-top: 14px; padding-left: 18px; border-left: 1px dashed var(--line); }
  .tree-domain { border: 1px solid var(--line); background: var(--panel-2); }
  .tree-domain-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); border-top: 2px solid var(--dom-c); }
  .tree-domain-name { font-family: var(--display); font-weight: 700; font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dom-c); }
  .tree-domain-stat { color: var(--faint); font-size: 10.5px; }
  .tree-tasks { display: flex; flex-direction: column; gap: 10px; padding: 10px; }
  .tree-task { display: flex; flex-direction: column; gap: 6px; }
  .tree-task-head { display: flex; align-items: center; gap: 8px; }
  .tree-task-name { font-size: 11.5px; color: var(--text); flex: 1; min-width: 0; }
  .diff-pips { display: inline-flex; gap: 2px; }
  .diff-pips .pip { width: 4px; height: 9px; background: var(--line); display: inline-block; }
  .diff-pips .pip.on { background: var(--muted); }
  .tree-queued-note { color: var(--faint); font-size: 10.5px; padding: 4px 2px; }
  .run-node { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--faint); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; margin-left: 12px; }
  .run-node.root-node { margin-left: 0; background: var(--panel-2); }
  .run-live { border-left-color: var(--accent); }
  .run-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .run-role { font-weight: 600; font-size: 11.5px; color: var(--text); }
  .retry-flag { color: #c9a857; font-size: 10px; }
  .run-meta { display: flex; gap: 12px; color: var(--muted); font-size: 10.5px; }
  .run-decision { color: var(--faint); font-size: 10.5px; line-height: 1.5; font-style: italic; }

  /* agents */
  .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: var(--pad); }
  .agent-card { background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--dom-c); padding: var(--card-pad); display: flex; flex-direction: column; gap: 8px; }
  .agent-card-head { display: flex; justify-content: space-between; align-items: center; }
  .agent-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .agent-live { display: flex; align-items: center; gap: 5px; color: var(--accent); font-size: 11px; }
  .agent-domain { color: var(--faint); font-size: 10.5px; }
  .agent-heat-track { height: 8px; background: var(--panel-2); }
  .agent-heat-fill { height: 100%; width: calc(var(--heat) * 100%); background: color-mix(in oklab, var(--dom-c) calc(35% + var(--heat) * 65%), var(--panel-2)); }
  .agent-meta { display: flex; gap: 12px; color: var(--muted); font-size: 10.5px; }
  .agent-meta b { color: var(--text); font-weight: 600; }

  /* ── validation / HITL ── */
  .hitl-grid .stat-card { border-top: 2px solid color-mix(in oklab, var(--accent) 40%, var(--line)); }
  .autonomy-panel { display: flex; flex-direction: column; }
  .gauge { position: relative; padding: 6px 0 0; max-width: 230px; margin: 0 auto; width: 100%; }
  .gauge-center { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
  .gauge-pct { font-family: var(--display); font-weight: 800; font-size: 38px; color: #7fae6a; line-height: 1; }
  .gauge-pct span { font-size: 18px; }
  .gauge-cap { color: var(--muted); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 2px; }
  .autonomy-legend { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .autonomy-legend b { color: var(--text); }
  .al-dot { width: 8px; height: 8px; display: inline-block; margin-right: 7px; }
  .al-foot { color: var(--faint); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }

  .roi-hero { display: flex; align-items: center; gap: 16px; padding: 8px 0 14px; flex-wrap: wrap; }
  .roi-dual { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 12px; }
  .roi-lane { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .roi-lane-tag { font-size: 10px; letter-spacing: 0.14em; color: var(--muted); width: 58px; flex: none; }
  .roi-eqn { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .roi-big { display: flex; flex-direction: column; }
  .roi-val { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: 0.01em; }
  .roi-cap { color: var(--muted); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 3px; }
  .roi-ratio .roi-val { color: #7fae6a; }
  .roi-x, .roi-eq { color: var(--faint); font-size: 18px; font-family: var(--display); }
  .roi-sub { display: flex; gap: 22px; flex-wrap: wrap; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: 12px; }
  .roi-sub b { color: var(--text); }
  .reason-note { color: var(--faint); font-size: 10.5px; line-height: 1.5; margin-top: 10px; }
  .catch-cell { color: var(--text); }
  .gate-by-human { color: #b48ee0; }
  .gate-by-agent { color: #7fae6a; }

  /* category rollup */
  .cat-rollup { display: flex; flex-direction: column; gap: 6px; }
  .cat-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; background: none; border: 1px solid transparent; padding: 4px 6px; cursor: pointer; font-family: var(--mono); text-align: left; }
  .cat-row:hover { border-color: var(--line); }
  .cat-row.on { background: var(--panel-2); border-color: var(--line); }
  .cat-bar-track { height: 9px; background: var(--panel-2); }
  .cat-bar-fill { display: block; height: 100%; }
  .cat-stat { color: var(--muted); font-size: 10.5px; white-space: nowrap; }
  .cat-chip { display: inline-flex; align-items: center; font-size: 10px; letter-spacing: 0.04em; color: var(--cat-c); border: 1px solid color-mix(in oklab, var(--cat-c) 45%, transparent); padding: 1px 7px; background: color-mix(in oklab, var(--cat-c) 12%, transparent); white-space: nowrap; }
  .cat-chip.sm { font-size: 9.5px; padding: 1px 6px; margin-left: 8px; }

  /* flag log */
  .log-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); }
  .seg-btn { font-family: var(--mono); font-size: 10.5px; background: none; border: none; color: var(--muted); padding: 4px 11px; cursor: pointer; letter-spacing: 0.04em; }
  .seg-btn:not(:last-child) { border-right: 1px solid var(--line); }
  .seg-btn.on { background: var(--panel-2); color: var(--text); }
  .filter-clear { font-family: var(--mono); font-size: 10.5px; background: color-mix(in oklab, var(--accent) 14%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); color: var(--accent); padding: 4px 9px; cursor: pointer; }
  .flag-status { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border: 1px solid; }
  .flag-revised { color: #c9a857; border-color: #c9a85766; }
  .flag-blocked { color: #e0635a; border-color: #e0635a66; }
  .tag-row { display: inline-flex; gap: 6px; margin-left: 8px; flex-wrap: wrap; }
  .tag { color: var(--faint); font-size: 10px; }
  .hours-cell { color: var(--muted); font-size: 10.5px; margin-left: 8px; }

  /* period picker */
  .period-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; }
  .period-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .period-title { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .gran-seg .seg-btn { text-transform: capitalize; }
  .period-pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .period-pill { font-family: var(--mono); font-size: 11px; background: none; border: 1px solid var(--line); color: var(--muted); padding: 5px 12px; cursor: pointer; letter-spacing: 0.02em; }
  .period-pill:hover { color: var(--text); }
  .period-pill.on { background: var(--panel-2); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
  .period-summary { color: var(--muted); font-size: 11px; }

  /* cycle time before/after */
  .cycle-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--pad); }
  .cycle-row { border: 1px solid var(--line); background: var(--panel-2); padding: 12px; }
  .cycle-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .cycle-type { font-family: var(--display); font-weight: 700; font-size: 13px; }
  .cycle-count { color: var(--faint); font-size: 10.5px; }
  .cycle-speed { margin-left: auto; color: #7fae6a; font-size: 12px; font-weight: 600; }
  .cycle-bars { display: flex; flex-direction: column; gap: 6px; }
  .cycle-bar { display: grid; grid-template-columns: 44px 1fr 48px; gap: 8px; align-items: center; }
  .cb-label { color: var(--muted); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .cb-track { height: 12px; background: var(--bg); }
  .cb-fill { display: block; height: 100%; }
  .cb-before { background: #6e6856; }
  .cb-after { background: #7fae6a; }
  .cb-val { text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
  .cycle-foot { color: var(--faint); font-size: 10px; margin-top: 9px; }
  .cycle-total { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .cycle-total > div { display: flex; flex-direction: column; }
  .ct-val { font-family: var(--display); font-weight: 800; font-size: 20px; }
  .ct-cap { color: var(--muted); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 3px; }

  .reason-stat { display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; color: var(--muted); font-size: 11px; }
  .reason-stat b { color: var(--text); font-family: var(--display); font-size: 14px; }

  /* ticket type badges */
  .ttype { font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border: 1px solid; }
  .ttype-bug { color: #e0635a; border-color: #e0635a66; }
  .ttype-feature { color: #6a9bcc; border-color: #6a9bcc66; }
  .ttype-project { color: #b48ee0; border-color: #b48ee066; }

  /* gate nodes in spawn tree */
  .gate-node { margin: 2px 0 0 12px; padding: 8px 10px; border: 1px solid var(--oc); border-left-width: 2px; background: color-mix(in oklab, var(--oc) 9%, var(--panel)); display: flex; flex-direction: column; gap: 4px; }
  .gate-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .gate-badge { font-size: 9.5px; letter-spacing: 0.12em; font-weight: 600; color: var(--muted); }
  .gate-human .gate-badge { color: #b48ee0; }
  .gate-outcome { font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .gate-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 10.5px; }
  .gate-caught { color: #c9a857; }
  .gate-mit { color: #7fae6a; }
  .gate-note { color: var(--faint); font-size: 10.5px; font-style: italic; line-height: 1.5; }

  /* autonomy badge */
  .auto-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 0.06em; padding: 2px 7px; border: 1px solid; }
  .auto-badge.auto-yes { color: #7fae6a; border-color: #7fae6a66; }
  .auto-badge.auto-no { color: #b48ee0; border-color: #b48ee066; }

  @media (max-width: 1100px) { .board { grid-template-columns: repeat(3, 1fr); } .stat-grid { grid-template-columns: repeat(2, 1fr); } .panel-row { flex-direction: column; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="factory-components.jsx"></script>
<script type="text/babel" src="factory-views.jsx"></script>
<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#7fae6a",
    "density": "regular",
    "unit": "cost"
  }/*EDITMODE-END*/;

  // ── Data adapter ─────────────────────────────────────────────────────────
  // Normalises real collector output (dashboard.json) to the shape the views
  // expect. Never fabricates numbers — fields missing in the real data are left
  // null and views render "insufficient data" where appropriate.
  function adaptDashboard(raw) {
    // Ensure byModel contains entries for every key the views reference.
    // Real data may lack haiku-4 entirely; provide a zero-entry so MODELS
    // lookups in the charts don't crash.
    const byModel = { ...raw.byModel };
    ['opus-4.5', 'sonnet-4.5', 'haiku-4'].forEach(k => {
      if (!byModel[k]) byModel[k] = { tokens: 0, cost: 0, calls: 0 };
    });

    // Ensure byDomain has entries for all 5 domains.
    const byDomain = { ...raw.byDomain };
    ['product', 'design', 'engineering', 'qa', 'deploy'].forEach(k => {
      if (!byDomain[k]) byDomain[k] = { tokens: 0, cost: 0, calls: 0 };
    });

    // Ensure validation has the full shape views expect.
    // Real data only has: autonomyRate, gateApproved, gateBlocked, gateRevised, totalGates
    const rv = raw.validation || {};
    const validation = {
      autonomyRate:        rv.autonomyRate       != null ? rv.autonomyRate       : null,
      gatesTotal:          rv.totalGates         != null ? rv.totalGates         : (rv.gateApproved != null ? (rv.gateApproved + (rv.gateRevised || 0) + (rv.gateBlocked || 0)) : null),
      human:               null,  // not in real collector output
      agent:               null,  // not in real collector output
      approved:            rv.gateApproved       != null ? rv.gateApproved       : null,
      revised:             rv.gateRevised        != null ? rv.gateRevised        : null,
      blocked:             rv.gateBlocked        != null ? rv.gateBlocked        : null,
      caughtGates:         null,
      caughtIssues:        null,
      mitigatedCost:       null,  // not tracked at this fidelity
      mitigatedHours:      null,
      humanMinutes:        null,
      humanHours:          null,
      reviewHours:         null,
      autonomousFeatures:  null,
      reasoningTokens:     raw.totals ? (raw.totals.reasoningTokens || null) : null,
      reasoningByModel:    {},
      byCategory:          {},
      verifierCost:        null,
    };

    // features array: real features have domains=string[] and reach=null.
    // Adapt reach for pipeline bucketing: use domain list length as proxy
    // (null means unstarted → 0).
    const features = (raw.features || []).map(f => ({
      ...f,
      // keep domains as-is (string[] or empty — SpawnTree handles both)
      // ensure safe numeric defaults
      cost:         f.cost         != null ? f.cost         : null,
      tokens:       f.tokens       != null ? f.tokens       : null,
      ageDays:      f.ageDays      != null ? f.ageDays      : null,
      runs:         f.runs         != null ? f.runs         : null,
      hoursSaved:   f.hoursSaved   != null ? f.hoursSaved   : null,
      baselineHours:f.baselineHours!= null ? f.baselineHours: null,
      actualHours:  f.actualHours  != null ? f.actualHours  : null,
      // ticketType fallback (real data uses "type", not "ticketType")
      ticketType:   f.ticketType   || f.type || 'Feature',
    }));

    // totals: real data matches shape; add reasoningTokens fallback
    const totals = {
      ...raw.totals,
      reasoningTokens: (raw.totals && raw.totals.reasoningTokens != null) ? raw.totals.reasoningTokens : null,
    };

    return {
      byModel,
      byRole:   raw.byRole   || {},
      byDomain,
      days:     raw.days     || [],
      features,
      totals,
      validation,
      tickets:  raw.tickets  || [],
      periods:  raw.periods  || { months: [], quarters: [] },
      meta:     raw.meta     || {},
    };
  }

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const [tab, setTab] = React.useState(() => {
      try { return localStorage.getItem('factory.tab') || 'overview'; } catch { return 'overview'; }
    });
    const [taskId, setTaskId] = React.useState(() => {
      try { return localStorage.getItem('factory.task') || null; } catch { return null; }
    });

    // Data loading state — never falls back to fabricated mock data
    const [loadState, setLoadState] = React.useState('loading'); // 'loading' | 'ok' | 'error'
    const [loadError, setLoadError] = React.useState(null);
    const [data, setData] = React.useState(null);

    const loadData = React.useCallback(() => {
      setLoadState('loading');
      setLoadError(null);
      fetch('/data/dashboard.json')
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
          return res.json();
        })
        .then(raw => {
          setData(adaptDashboard(raw));
          setLoadState('ok');
        })
        .catch(err => {
          setLoadError(err.message || String(err));
          setLoadState('error');
        });
    }, []);

    React.useEffect(() => { loadData(); }, [loadData]);

    React.useEffect(() => {
      try { localStorage.setItem('factory.tab', tab); } catch {}
    }, [tab]);
    React.useEffect(() => {
      try {
        if (taskId) localStorage.setItem('factory.task', taskId);
        else localStorage.removeItem('factory.task');
      } catch {}
    }, [taskId]);
    React.useEffect(() => {
      document.documentElement.style.setProperty('--accent', t.accent);
      document.documentElement.setAttribute('data-density', t.density);
    }, [t.accent, t.density]);

    const openTask = (id) => setTaskId(id);
    const dense = t.density === 'compact';

    const TABS = [['overview', 'Overview'], ['pipeline', 'Pipeline'], ['validation', 'Validation'], ['agents', 'Agents']];

    const runCount = data ? (data.totals.running || 0) : 0;
    const metaTs = data && data.meta && data.meta.latestSourceTs
      ? new Date(data.meta.latestSourceTs).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : null;

    return (
      <div>
        <header className="hdr" data-screen-label="Header">
          <div className="hdr-brand">
            <div className="hdr-mark">AF</div>
            <div>
              <div className="hdr-title">AI Factory</div>
              <div className="hdr-sub">TASK tracking · Worldline GENESIS</div>
            </div>
          </div>
          <nav className="hdr-nav">
            {TABS.map(([id, label]) => (
              <button key={id} className={'nav-btn' + (tab === id && !taskId ? ' on' : '')}
                onClick={() => { setTaskId(null); setTab(id); }}>{label}</button>
            ))}
          </nav>
          <div className="hdr-live">
            <StatusDot status={runCount > 0 ? 'running' : 'done'} />
            {loadState === 'ok' ? runCount + ' agents live' : (loadState === 'loading' ? 'loading…' : 'offline')}
          </div>
          {metaTs && <div className="hdr-meta">updated {metaTs}</div>}
        </header>

        {loadState === 'loading' && (
          <div className="state-screen" aria-live="polite">
            <div className="state-icon">⋯</div>
            <div className="state-title">Loading dashboard</div>
            <div className="state-detail">Fetching /data/dashboard.json from the local serve.mjs server.</div>
          </div>
        )}

        {loadState === 'error' && (
          <div className="state-screen" role="alert">
            <div className="state-icon">✕</div>
            <div className="state-title">Failed to load dashboard</div>
            <div className="state-detail">{loadError}<br />Make sure <code>node scripts/factory/serve.mjs</code> is running and serving on this port.</div>
            <button className="retry-btn" onClick={loadData}>↻ Retry</button>
          </div>
        )}

        {loadState === 'ok' && data && (
          <>
            {taskId
              ? <div data-screen-label="TASK detail"><TaskDetailView data={data} featureId={taskId} back={() => setTaskId(null)} dense={dense} /></div>
              : tab === 'overview'   ? <div data-screen-label="Overview"><OverviewView data={data} unit={t.unit} openTask={openTask} /></div>
              : tab === 'pipeline'   ? <div data-screen-label="Pipeline"><PipelineView data={data} openTask={openTask} /></div>
              : tab === 'validation' ? <div data-screen-label="Validation"><ValidationView data={data} openTask={openTask} /></div>
              : <div data-screen-label="Agents"><AgentsView data={data} unit={t.unit} /></div>}

            <TweaksPanel>
              <TweakSection label="Look" />
              <TweakRadio label="Density" value={t.density} options={['regular', 'compact']}
                onChange={(v) => setTweak('density', v)} />
              <TweakRadio label="Metric unit" value={t.unit} options={['cost', 'tokens']}
                onChange={(v) => setTweak('unit', v)} />
              <TweakColor label="Accent" value={t.accent} options={['#d97757', '#6a9bcc', '#7fae6a', '#b48ee0']}
                onChange={(v) => setTweak('accent', v)} />
            </TweaksPanel>
          </>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
